name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  fast:
    # Quick feedback: format, lint, types, unit tests (slow tests skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check (black)
        run: make format-check

      - name: Lint (flake8)
        run: make lint

      - name: Type check (mypy)
        run: make type-check

      - name: Tests, fast subset (pytest -m "not slow")
        run: make test

  slow-tests:
    # Complete suite: the slow graph-build tests, run only after fast passes
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests, slow subset (pytest -m slow)
        run: make test-slow
